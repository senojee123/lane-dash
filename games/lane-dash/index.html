<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lane Dash — Endless Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0a14; font-family: 'Segoe UI', Verdana, sans-serif; }
  #game-canvas { display:block; width:100%; height:100%; touch-action:none; }

  #hud {
    position:fixed; top:0; left:0; width:100%; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:5; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  /* clamp() instead of fixed px so the HUD scales down on narrow phone
     screens rather than assuming a fixed desktop-sized viewport. */
  #hud .score-block { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  #hud .sub { font-size:clamp(11px,3vw,14px); font-weight:600; opacity:.85; margin-top:2px; }
  #hud .hud-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  #hud .coin-block { font-size:clamp(15px,4.5vw,22px); font-weight:700; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.28); padding:8px 14px; border-radius:30px; }
  #hud .mult-block {
    font-size:clamp(13px,4vw,20px); font-weight:800; letter-spacing:.5px; padding:6px 14px; border-radius:30px;
    background:rgba(0,0,0,.28); color:#7CFF9E;
  }
  #hud .coin-dot { width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6c0, #ffcf33 55%, #cf9600); box-shadow:0 0 6px #ffdd55; }

  /* #hud itself is pointer-events:none (score/coins shouldn't eat swipes), so
     the pause button opts itself back in and is the one HUD element sized
     for a fingertip — 44px is the standard minimum comfortable touch target. */
  #hud-pause-btn {
    pointer-events:auto; width:44px; height:44px; min-width:44px; min-height:44px;
    border-radius:50%; border:none; background:rgba(0,0,0,.32); color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-bottom:4px; align-self:flex-end;
  }
  #hud-pause-btn:active { background:rgba(0,0,0,.5); }

  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(20,10,40,.55), rgba(5,5,15,.85));
    color:#fff; text-align:center; z-index:10; padding:20px;
  }
  .overlay.hidden { display:none; }
  .title-logo {
    font-size:clamp(38px,8vw,64px); font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#ffe259,#ffa751,#ff5f8f,#7c4dff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 18px rgba(0,0,0,.35); margin-bottom:6px;
  }
  .subtitle { font-size:15px; opacity:.85; margin-bottom:26px; }
  .name-input {
    padding:14px 16px; font-size:18px; border-radius:10px; border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06); color:#fff; text-align:center; width:min(280px,80vw);
    margin-bottom:22px; outline:none; font-family:inherit;
  }
  .name-input::placeholder { color:rgba(255,255,255,.4); }
  .name-input:focus { border-color:#ffd166; }
  .big-btn {
    font-size:20px; font-weight:800; letter-spacing:.5px; color:#1a1a1a;
    background:linear-gradient(90deg,#ffe259,#ffa751); border:none; padding:16px 46px;
    border-radius:50px; cursor:pointer; box-shadow:0 8px 20px rgba(255,150,60,.4);
    transition:transform .12s ease;
  }
  .big-btn:active { transform:scale(.94); }
  .go-score { font-size:52px; font-weight:900; margin:6px 0 2px; }
  .go-sub { font-size:16px; opacity:.85; margin-bottom:4px; }
  .go-high { font-size:15px; color:#ffd166; font-weight:700; margin-bottom:22px; }
  .new-high { color:#7CFF9E; font-weight:800; }

  .big-btn.secondary {
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
    box-shadow:none; font-size:16px; padding:12px 34px; margin-top:12px;
  }
  .bank-line {
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-size:16px; font-weight:700; margin-bottom:18px; opacity:.92;
  }
  .coin-dot { width:18px; height:18px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 35% 30%, #fff6c0, #ffcf33 55%, #cf9600); box-shadow:0 0 6px #ffdd55; }
  #flash-overlay {
    position:fixed; inset:0; background:#ff2b4d; opacity:0; pointer-events:none; z-index:8; transition:opacity .05s linear;
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  #speedlines {
    position:fixed; inset:0; pointer-events:none; z-index:3; opacity:0;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0deg 2deg, rgba(0,0,0,0) 2deg 8deg);
    mix-blend-mode: screen;
  }

  /* Loading screen sits ABOVE the HUD (5) and every other overlay (10) and
     is fully opaque, so nothing behind it — including the pop-in of models
     that are still mid-load — is visible until loading finishes. */
  #loading-screen {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg, #180f2c, #08050f);
    color:#fff; text-align:center;
  }
  #loading-screen.hidden { display:none; }
  .loading-spinner {
    width:52px; height:52px; border-radius:50%; margin-bottom:22px;
    border:5px solid rgba(255,255,255,.15); border-top-color:#ffcf33;
    animation: loading-spin .9s linear infinite;
  }
  @keyframes loading-spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; opacity:.8; }
  .loading-bar-track {
    width:min(340px, 70vw); height:8px; border-radius:6px; margin-top:16px;
    background:rgba(255,255,255,.15); overflow:hidden;
  }
  .loading-bar-fill {
    height:100%; width:0%; background:linear-gradient(90deg,#ffe259,#ffa751);
    transition:width .15s ease;
  }

  .pause-line {
    font-size:16px; font-weight:700; opacity:.85; margin-bottom:6px;
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="vignette"></div>
<div id="speedlines"></div>
<div id="flash-overlay"></div>

<div id="loading-screen">
  <div class="title-logo" style="font-size:clamp(30px,7vw,52px);">LANE DASH</div>
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Loading assets&hellip;</div>
  <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
</div>

<div id="hud" style="display:none;">
  <div>
    <div class="score-block" id="hud-score">0</div>
    <div class="sub" id="hud-high">Best: 0</div>
  </div>
  <div class="hud-right">
    <button id="hud-pause-btn" aria-label="Pause">&#10074;&#10074;</button>
    <div class="coin-block"><span class="coin-dot"></span><span id="hud-coins">0</span></div>
    <div class="mult-block" id="hud-mult">x1</div>
  </div>
</div>

<div id="start-screen" class="overlay">
  <div class="title-logo">LANE DASH</div>
  <div class="subtitle">Help Joshua keep running</div>
  <input type="text" id="username-input" class="name-input" placeholder="Enter your name..." maxlength="12">
  <div class="bank-line"><span class="coin-dot"></span>coins &times; distance multiplier = score</div>
  <button class="big-btn" id="start-btn">TAP TO RUN</button>
</div>

<div id="gameover-screen" class="overlay hidden">
  <div class="title-logo" style="font-size:38px;">WIPED OUT</div>
  <div class="go-score" id="go-score">0</div>
  <div class="go-sub" id="go-coins">0 coins collected</div>
  <div class="go-high" id="go-high">Best: 0</div>
  <button class="big-btn" id="restart-btn">RESTART</button>
  <button class="big-btn secondary" id="gameover-menu-btn">MAIN MENU</button>
</div>

<div id="pause-screen" class="overlay hidden">
  <div class="title-logo" style="font-size:38px;">PAUSED</div>
  <div class="pause-line">Score</div>
  <div class="go-score" id="pause-score">0</div>
  <div class="go-sub" id="pause-coins">0 coins &times; 1</div>
  <button class="big-btn" id="pause-resume-btn">CONTINUE</button>
  <button class="big-btn secondary" id="pause-end-btn">END RUN</button>
  <div style="margin-top:16px; opacity:.6; font-size:13px;">Tap CONTINUE to resume</div>
</div>

<!-- Loading progress tracker: every asset-loading module (assets.js's model
     cache users — cityModels.js / trafficVehicles.js / character.js) reports
     into this as it goes, so the loading screen above can't be dismissed
     until everything it counted has actually resolved. Declared before the
     library/game scripts so it exists by the time they run. -->
<script>
  window.AssetLoader = {
    total: 0,
    loaded: 0,
    add(n) { this.total += n; this._render(); },
    tick() { this.loaded++; this._render(); },
    _render() {
      const textEl = document.getElementById('loading-text');
      const fillEl = document.getElementById('loading-bar-fill');
      if (!this.total) { if (textEl) textEl.textContent = 'Loading assets…'; return; }
      const done = Math.min(this.loaded, this.total);
      const pct = (done / this.total) * 100;
      if (textEl) textEl.textContent = 'Loading assets… ' + done + ' / ' + this.total;
      if (fillEl) fillEl.style.width = pct + '%';
    },
  };
</script>

<!-- Three.js r128 (single dependency, no build step) -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<!-- FBXLoader deps: fflate inflates binary FBX, NURBSCurve is a hard require -->
<script src="https://unpkg.com/fflate@0.6.9/umd/index.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/curves/NURBSUtils.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/curves/NURBSCurve.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- CONTENT PACK (this reskin's theme) vs ENGINE (generic, reused by every
     reskin) — see engine/asset-registry.js's header for the full load-order
     contract. Short version: this pack's assets.js declares AssetRegistry's
     entries, so it has to load before engine/asset-registry.js attaches the
     generic .create()/MeshPool machinery onto that same object; everything
     after that point just needs AssetRegistry + ModelCache to already exist. -->
<script src="assets.js"></script>
<script src="../../engine/asset-registry.js"></script>
<script src="cityModels.js"></script>
<script src="trafficVehicles.js"></script>
<script src="character.js"></script>
<!-- Config (see config.example.js) must load before both the Supabase CDN
     client and leaderboard-client.js, which reads window.GAME_CONFIG from it. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../engine/leaderboard-client.js"></script>
<script src="game.js"></script>
<script src="../../engine/touch-controls.js"></script>
</body>
</html>
