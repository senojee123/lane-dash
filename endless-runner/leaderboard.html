<!DOCTYPE html>
<html>
<head>
    <title>Live Leaderboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: black; color: white; font-family: Arial; text-align: center; font-size: 32px; }
        .row { margin: 20px; }
    </style>
</head>
<body>
    <h1>🏆 TOP RUNNERS 🏆</h1>
    <div id="board">Loading scores...</div>

    <script>
        const supabaseUrl = 'https://ornjmnakoxjnjvvqqeho.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ybmptbmFrb3hqbmp2dnFxZWhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjYwMjUsImV4cCI6MjEwMTMwMjAyNX0.dMInrvT2aYnRTmQ5XHUhv2J9MsOIKZ94xE9RznKoMhE';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchLeaderboard() {
            // Grab top 10 items sorted from highest score to lowest
            let { data, error } = await supabase
                .from('leaderboard')
                .select('name, score')
                .order('score', { ascending: false })
                .limit(10);

            const board = document.getElementById('board');
            board.innerHTML = '';
            
            data.forEach((player, index) => {
                board.innerHTML += `<div class="row">#${index + 1} - ${player.name}: ${player.score}m</div>`;
            });
        }

        // Fetch scores immediately when screen opens
        fetchLeaderboard();
        
        // Check for new scores every 3 seconds automatically
        setInterval(fetchLeaderboard, 3000);
    </script>
</body>
</html>
